<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Der Fall Rom</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Der Fall Rom">
<meta name="theme-color" content="#0e1317">
<style>
/* Layout: eine Spalte, Kopfleiste mit vier Siegeln, feste Tab-Leiste unten, alles für Daumen auf dem iPhone.
   Look: Nachtakte aus Rom. Tinte und Pergament, Messing als Akzent, vier Elementfarben nur für die Siegel. */
:root {
  --ink: #0e1317;
  --panel: #162027;
  --panel-2: #1e2a33;
  --line: #2c3a45;
  --paper: #f1e9d6;
  --muted: #a9b2b6;
  --brass: #d0a64f;
  --brass-dim: #8d6d27;
  --earth: #a3b86c;
  --air: #8ec5ea;
  --fire: #f08a55;
  --water: #52bdb5;
  --ok: #8bd196;
  --bad: #f0968d;
  --display: "Iowan Old Style", "Baskerville", "Palatino Linotype", Georgia, serif;
  --body: -apple-system, "SF Pro Text", system-ui, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--ink); color: var(--paper); height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body { font-family: var(--body); font-size: 17px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
/* App-Rahmen: Die Seite selbst scrollt nie. Nur .scroller scrollt, die Tab-Leiste steht fest darunter (nichts ist position:fixed, das beim Ein- und Ausfahren der Safari-Leiste springen kann). */
.shell { height: 100%; height: 100dvh; display: flex; flex-direction: column; background: var(--ink); }
.scroller { flex: 1 1 auto; min-height: 0; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 0 16px 24px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: 2rem; } h2 { font-size: 1.35rem; } h3 { font-size: 1.08rem; }
p { margin: 0; }
a { color: var(--brass); }
button { font: inherit; color: inherit; }
.wrap { max-width: 560px; margin: 0 auto; }
.mono { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* Kopf */
.top { position: sticky; top: 0; z-index: 15; background: var(--ink); border-bottom: 1px solid var(--line);
  margin-inline: -16px; padding: 10px 16px; }
.top-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.mini-seals { display: flex; gap: 8px; align-items: center; }
.mini-seals svg { width: 30px; height: 30px; display: block; }
.pts { font-family: var(--mono); font-size: 0.85rem; color: var(--brass); white-space: nowrap; }

main { display: flex; flex-direction: column; gap: 16px; padding-top: 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.hero { background: var(--panel-2); border-color: var(--brass-dim); }
.stamp { align-self: flex-start; border: 1.5px solid var(--brass); color: var(--brass); font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.14em; padding: 3px 8px; border-radius: 3px; transform: rotate(-2deg); text-transform: uppercase; }
.letter { font-family: var(--display); font-size: 1.05rem; line-height: 1.55; display: flex; flex-direction: column; gap: 10px; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }

.btn { appearance: none; border: 0; border-radius: 12px; padding: 14px 18px; min-height: 48px; font-weight: 600; background: var(--brass); color: #1a1406; text-align: center; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--paper); border: 1.5px solid var(--line); }
.btn.dim { background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
.btn:disabled { opacity: 0.5; }
.btn:focus-visible, .tab:focus-visible, .chip:focus-visible, input:focus-visible { outline: 3px solid var(--air); outline-offset: 2px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }

/* Tab-Leiste */
.tabs { flex: 0 0 auto; background: var(--panel); border-top: 1px solid var(--line); padding: 6px 10px 6px; }
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.tab { appearance: none; border: 0; background: transparent; padding: 8px 4px; border-radius: 10px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 0.74rem; min-height: 52px; cursor: pointer; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--brass); background: var(--panel-2); }

/* Tour */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { appearance: none; flex: 0 0 auto; border: 1.5px solid var(--line); background: var(--panel); border-radius: 999px; padding: 9px 16px; min-height: 44px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--brass); color: var(--brass); background: var(--panel-2); }
.daybox { display: flex; flex-direction: column; gap: 6px; }
.timeline { display: flex; flex-direction: column; gap: 10px; }
.stop { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; }
.stop .t { font-family: var(--mono); font-size: 0.82rem; color: var(--brass); padding-top: 14px; text-align: right; }
.stop .body { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.stop .body.done { border-color: #3c5b45; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.tag.earth { color: var(--earth); border-color: var(--earth); } .tag.air { color: var(--air); border-color: var(--air); }
.tag.fire { color: var(--fire); border-color: var(--fire); } .tag.water { color: var(--water); border-color: var(--water); }
.tag.finale { color: var(--brass); border-color: var(--brass); } .tag.ok { color: var(--ok); border-color: var(--ok); }
.stop-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.stop-actions .btn { min-height: 44px; padding: 10px 14px; font-size: 0.95rem; flex: 1 1 130px; }

/* Rätsel */
.back { align-self: flex-start; }
.step { display: flex; flex-direction: column; gap: 10px; }
.q { font-size: 1.1rem; }
input[type="text"] { width: 100%; font-size: 16px; padding: 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--ink); color: var(--paper); font-family: var(--body); }
.msg { min-height: 1.4em; font-size: 0.95rem; }
.msg.bad { color: var(--bad); } .msg.ok { color: var(--ok); }
.hint { background: var(--ink); border: 1px dashed var(--brass-dim); border-radius: 10px; padding: 10px 12px; font-size: 0.95rem; }
.reveal { background: var(--ink); border-left: 3px solid var(--ok); padding: 10px 12px; border-radius: 4px 10px 10px 4px; display: flex; flex-direction: column; gap: 6px; }
.seal-win { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 10px 0; }
.seal-win svg { width: 120px; height: 120px; animation: pop 0.6s ease-out both; }
@keyframes pop { from { transform: scale(0.4) rotate(-12deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .seal-win svg { animation: none; } }
.locked { opacity: 0.85; }

/* Siegel-Seite */
.seal-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.seal-cell { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0; }
.seal-cell svg { width: 84px; height: 84px; }
.notes { display: flex; flex-direction: column; gap: 10px; }
.note { border-left: 3px solid var(--brass-dim); padding-left: 12px; }
.note b { font-family: var(--display); font-weight: 600; }

/* Eltern */
details { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
summary { cursor: pointer; font-weight: 600; min-height: 32px; display: flex; align-items: center; }
details[open] summary { margin-bottom: 8px; }
.know { background: var(--ink); }
.know p + p, .know .know-h { margin-top: 10px; }
.know ul.plain { margin-top: 6px; }
ul.plain { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 6px; }
.kv { display: grid; grid-template-columns: 1fr; gap: 2px; }
.kv + .kv { margin-top: 8px; }
.kv b { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--brass); font-weight: 600; }
.warn { border: 1px solid var(--brass-dim); background: var(--panel-2); border-radius: 10px; padding: 10px 12px; font-size: 0.92rem; }

.hd { display: flex; gap: 10px; align-items: center; }
.badge { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); color: var(--brass); display: grid; place-items: center; }
.badge .ico { width: 28px; height: 28px; }
.scene { margin: -4px -4px 0; }
.scenesvg, .routesvg { display: block; width: 100%; height: auto; }
.bubble { display: flex; gap: 12px; align-items: flex-start; background: var(--panel-2); border: 1px solid var(--brass-dim); border-radius: 14px 14px 14px 4px; padding: 12px 14px; font-size: 0.95rem; }
.bubble b { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--brass); }
.fist { flex: 0 0 auto; width: 34px; height: 34px; color: var(--brass); }
.fist svg { width: 100%; height: 100%; }
.legend { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.lg { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.8rem; color: var(--muted); }
.lg svg { width: 100%; max-width: 64px; height: auto; }
.viz { display: block; width: 100%; height: auto; background: var(--ink); border: 1px solid var(--line); border-radius: 10px; }
</style>
</head>
<body>

<div class="shell">
  <div class="scroller" id="scroller">
    <div class="top"><div class="top-in" id="top"></div></div>
    <div class="wrap"><main id="app" aria-live="polite"></main></div>
  </div>
  <nav class="tabs" aria-label="Bereiche"><div class="tabs-in" id="tabs"></div></nav>
</div>

<script>
(function () {
  "use strict";

  /* ---------- Inhalt ---------- */
  var ELEM = {
    earth: { name: "Erde", color: "var(--earth)", up: false, bar: true },
    water: { name: "Wasser", color: "var(--water)", up: false, bar: false },
    fire: { name: "Feuer", color: "var(--fire)", up: true, bar: false },
    air: { name: "Luft", color: "var(--air)", up: true, bar: true }
  };
  var ORDER = ["earth", "water", "fire", "air"];

  var DAYS = [
    { id: "so", label: "So 25.10.", title: "Anreise und Auftrag", role: "Navigator: du führst Papa zum richtigen Gleis und zur Unterkunft.", stops: [
      { id: "s-zug", time: "13:57", name: "Zug nach Rom", where: "Rovereto, Frecciarossa 8519, Ankunft Roma Termini 18:10", maps: "Stazione di Rovereto", note: "Dein Job als Navigator: Gleis auf der Anzeigetafel finden und im Zug den richtigen Wagen. Die Tickets hat Papa im Handy." },
      { id: "s-hotel", time: "18:30", name: "Einchecken", where: "Napoleone Suite, Via Napoleone III 28", maps: "Via Napoleone III 28, Roma", note: "Gleich beim Bahnhof. Ausweis bereithalten." },
      { id: "s-dossier", time: "19:15", name: "Das Dossier", where: "Spaziergang zum Kolosseum bei Nacht", maps: "Colosseo, Roma", kind: "dossier", note: "Hier startet der Fall. Check unterwegs das Dossier auf der Startseite. Das Kolosseum gibt's heute nur zum Angucken, gelöst wird ab morgen." },
      { id: "s-essen", time: "20:00", name: "Abendessen", where: "Ai Tre Scalini, Via Panisperna 251", maps: "Ai Tre Scalini Via Panisperna 251 Roma", note: "Kassenwart: Du rechnest die Rechnung nach, Papa darf nicht schummeln. Frage des Abends: Was war heute das Schrägste?" }
    ]},
    { id: "mo", label: "Mo 26.10.", title: "Erde und Wasser", role: "Fotograf: fünf Bilder zum Thema Ruine trifft Alltag.", stops: [
      { id: "m-pantheon", time: "09:15", name: "Pantheon", where: "Piazza della Rotonda", maps: "Pantheon Roma", note: "Gleich als Erstes. Vom Hotel mit dem Taxi (rund 10 Minuten) oder Bus, Papa prüft vorher in Google Maps, was fährt. Laut Quelle ab 9 Uhr offen, morgens ist es leerer. Kinder unter 18 gratis, Erwachsene wenige Euro.", puzzle: {
        title: "Das Grab des Meisters", intro: "Fast 2000 Jahre alt und steht immer noch. Hier liegt ein berühmter Maler, dessen Kapelle ihr heute Abend besucht.",
        steps: [
          { id: "pan1", viz: "dome", q: "Die Öffnung ganz oben in der Kuppel lässt Licht und Regen herein. Wie heißt sie?", accept: ["oculus", "auge"], hints: ["Das lateinische Wort bedeutet Auge.", "Es beginnt mit O."], reveal: "Das Oculus misst gut acht Meter. Der Boden neigt sich leicht und hat Abflusslöcher, damit der Regen abläuft." },
          { id: "pan2", viz: "tl|1483|1520|Raffael geboren|gestorben", q: "Such Raffaels Grab: Über dem Sarkophag steht eine Marienstatue. Raffael lebte von 1483 bis 1520. Wie alt wurde er?", accept: ["37"], hints: ["Rechne 1520 minus 1483.", "Es sind mehr als 35 und weniger als 40 Jahre."], reveal: "37 Jahre. Er starb 1520, oft heißt es, genau an seinem Geburtstag. Sein Grab im Pantheon ist bis heute ein Pilgerort." }
        ] } },
      { id: "m-moses", time: "10:30", name: "Moses von Michelangelo", where: "San Pietro in Vincoli", maps: "San Pietro in Vincoli Roma", note: "Eintritt frei. Aufwärmrätsel. Vom Pantheon mit Taxi oder Bus (rund 15 Minuten), Navigator wählt in Google Maps die Öffis. Das Ende ist ein kurzer Fußweg.", puzzle: {
        title: "Der Mann mit dem Auffälligen", intro: "Ein Marmor-Typ sitzt hier seit über 500 Jahren rum. Guck ihm mal auf den Kopf.",
        steps: [{ id: "moses1", q: "Moses hat was Seltsames auf dem Kopf. Was?", accept: ["horn", "hoerner", "hörner", "horner"], hints: ["Schau auf seine Stirn, ganz oben.", "Zwei kleine spitze Dinger, wie bei einem Stier."], reveal: "Hörner. Eine alte lateinische Bibelübersetzung machte aus einem Wort für strahlend das Wort gehörnt (so wird es meist erklärt). Michelangelo hat es einfach übernommen." }] } },
      { id: "m-forum", time: "11:15", name: "Forum Romanum und Palatin", where: "Eingang Largo della Salara Vecchia", maps: "Foro Romano Largo della Salara Vecchia Roma", note: "Eltern kaufen vorher den Forum Pass Super. Kapitelfrage: Wo hat Rom entschieden? Heute ruhig angehen: Nur die Via Sacra bis zum Titusbogen, den Palatin-Hügel lasst ihr weg. Bänke und Pausen sind ausdrücklich erlaubt.", puzzle: {
        title: "Beute vom Titusbogen", intro: "Der Titusbogen feiert einen Sieg. Auf einem Relief tragen Soldaten ihre Beute durch die Stadt.",
        steps: [{ id: "forum1", q: "Die Soldaten tragen einen großen Leuchter mit sieben Armen aus einem eroberten Tempel. Wie heißt er?", accept: ["menora", "menorah", "leuchter"], hints: ["Er gehört zum jüdischen Glauben.", "Der Name beginnt mit M."], reveal: "Die Menora aus dem Tempel in Jerusalem. Rom eroberte die Stadt im Jahr 70 nach Christus. Der Bogen ist Siegerpropaganda in Stein." },
          { id: "forum2", viz: "tl|70|2026|Sieg über Jerusalem|Heute", q: "Der Sieg über Jerusalem war im Jahr 70 nach Christus. Wie viele Jahre ist das bis 2026 her?", accept: ["1956", "1 956"], hints: ["Rechne 2026 minus 70.", "Erst 2026 minus 100, dann plus 30."], reveal: "1956 Jahre. Der Bogen selbst wurde nach dem Tod von Titus gebaut, aber er erinnert an dieses Ereignis." }] } },
      { id: "m-kolo", time: "12:45", name: "Kolosseum im Hellen", where: "kurze Runde bei Tageslicht, dazu der Konstantinsbogen", maps: "Colosseo Roma", note: "Gestern Abend wart ihr schon da. Jetzt nur eine kurze Runde im Hellen, rund 15 Minuten, die Bögen zählen und weiter. Innen war alles ausverkauft.", puzzle: {
        title: "Bögen zählen", intro: "Das größte Stadion der Antike. Die Außenwand hat ein Muster, das du zählen kannst.",
        steps: [{ id: "kolo1", viz: "arch0", q: "Zähle von unten nach oben die Reihen mit Bögen (ohne die geschlossene Wand ganz oben). Wie viele Reihen sind es?", accept: ["3", "drei"], hints: ["Zähle nur die Reihen mit Löchern.", "Es sind weniger als vier."], reveal: "Drei Reihen mit je 80 Bögen, darüber eine geschlossene Wand mit kleinen Fenstern. Die Säulenformen wechseln von unten nach oben von schlicht zu verziert." },
          { id: "kolo2", viz: "arch80", q: "Jede der drei Reihen hat 80 Bögen. Wie viele Bögen sind das zusammen?", accept: ["240"], hints: ["80 + 80 + 80.", "3 mal 80."], reveal: "240 Bögen. 76 der Bögen im Erdgeschoss waren nummerierte Eingänge für das Publikum, damit sich Zehntausende schnell verteilen konnten." }] } },
      { id: "m-essen1", time: "13:15", name: "Mittagessen", where: "Pizza al taglio in der Nähe, Via di San Giovanni in Laterano", maps: "Luzzi Via di San Giovanni in Laterano 88 Roma", note: "Kassenwart: Tagesbudget aus dem Umschlag, du rechnest ab. Heute kurz halten, rund 45 Minuten. Vom Kolosseum sind es knapp 10 Minuten zu Fuß." },
      { id: "m-smm", time: "14:30", name: "Santa Maria Maggiore (freiwillig)", where: "Piazza di Santa Maria Maggiore, nahe der Unterkunft", maps: "Basilica di Santa Maria Maggiore Roma", note: "Metro B ab Colosseo bis Termini, dann ein kurzes Stück zu Fuß. Große Basilika mit goldener Decke, ruhig und flach, mit Sitzbänken. Danach Eis oder Kaffee in der Nähe. Wenn ihr lieber Pause macht, lasst es weg." },
      { id: "m-hotel", time: "16:00", name: "In der Unterkunft", where: "Napoleone Suite, Via Napoleone III 28", maps: "Via Napoleone III 28, Roma", note: "Ab 16 Uhr bleibt ihr in der Unterkunft, denn Papa telefoniert von 16 bis 17 Uhr für die Arbeit. Bein hochlegen, leise sein." },
      { id: "m-metro", time: "17:00", name: "Metro zur Piazza del Popolo", where: "Metro A ab Termini Richtung Battistini bis Flaminio", maps: "Flaminio metro Roma", note: "Navigator: Linie A ab Termini, Haltestelle Flaminio, ohne Umsteigen. Danach durch das Tor auf den Platz. Draußen wird es jetzt dunkel, das macht die Plätze schöner." },
      { id: "m-popolo", time: "17:25", name: "Santa Maria del Popolo", where: "Piazza del Popolo, Chigi-Kapelle", maps: "Santa Maria del Popolo Roma", seal: "earth", note: "Die Kirche ist laut Quelle nachmittags bis 19 Uhr offen. Leise sein, Schultern und Knie bedecken. Etwa eine halbe Stunde einplanen.", puzzle: {
        title: "Siegel der Erde", intro: "Ort Nummer eins. Eine Kapelle voller versteckter Zeichen. Such die Seitenkapelle mit den zwei Bernini-Statuen.",
        steps: [
          { id: "pop1", q: "Die Chigi-Kapelle hat ein berühmter Maler entworfen. Er liegt auch im Pantheon begraben. Wie heißt er?", accept: ["raffael", "raphael", "raffaello"], hints: ["Auch eine der Ninja-Turtles heißt so.", "Er hat die Schule von Athen gemalt."], reveal: "Raffael. Er entwarf die Kapelle für den reichen Bankier Agostino Chigi." },
          { id: "pop2", q: "Bernini hat in der Kapelle zwei Propheten aus Stein gemeißelt. Einer sitzt zwischen Löwen. Wie heißt er?", accept: ["daniel"], hints: ["Seine Geschichte heißt Daniel in der Löwengrube.", "Der Name hat sechs Buchstaben."], reveal: "Daniel, und gegenüber steht Habakuk mit einem Engel. Beide Statuen sind von Bernini. Das Zeichen der Erde ist ein Dreieck mit der Spitze nach unten und einem Querstrich." }
        ], outro: "Siegel der Erde gesichert." } },
      { id: "m-navona", time: "18:20", name: "Piazza Navona", where: "Vier-Ströme-Brunnen von Bernini", maps: "Fontana dei Quattro Fiumi Roma", seal: "water", note: "Vom Popolo mit Taxi oder Bus (rund 10 Minuten), zu Fuß wären es 25. Abends ist der Brunnen angestrahlt. Eis unterwegs erlaubt.", puzzle: {
        title: "Siegel des Wassers", intro: "Ort Nummer zwei. Vier Flussgötter hocken um einen Obelisken. Einer versteckt sein Gesicht.",
        steps: [
          { id: "nav1", viz: "rivers", q: "Die vier Flüsse sind Nil, Ganges, Donau und Rio de la Plata. Einer hält sich ein Tuch vor den Kopf. Welcher?", accept: ["nil"], hints: ["Er steht für den Fluss, dessen Quelle damals niemand kannte.", "Er fließt in Afrika."], reveal: "Der Nil. Seine Quelle war zur Bauzeit unbekannt, deshalb ist sein Kopf verhüllt (so wird es meist erklärt)." },
          { id: "nav2", q: "Oben auf dem Obelisken, rund 16 Meter hoch, sitzt ein Vogel. Welcher?", accept: ["taube", "dove"], hints: ["Er ist ein Friedenssymbol.", "Er steht auch im Wappen der Familie des Papstes, der den Brunnen bestellte."], reveal: "Eine Taube. Das Zeichen des Wassers ist ein Dreieck mit der Spitze nach unten, ohne Querstrich." },
          { id: "nav3", viz: "tl|1651|2026|Brunnen fertig|Heute", q: "Bernini hat den Brunnen 1651 fertiggestellt. Wie alt ist er heute (2026)?", accept: ["375"], hints: ["Rechne 2026 minus 1651.", "2026 minus 1600 ist 426, dann noch 51 abziehen."], reveal: "375 Jahre. Der Brunnen läuft also seit gut dreieinhalb Jahrhunderten." }
        ], outro: "Siegel des Wassers gesichert." } },
      { id: "m-essen2", time: "19:15", name: "Abendessen", where: "Osteria dell'Ingegno oder Armando al Pantheon", maps: "Osteria dell'Ingegno Piazza di Pietra Roma", note: "Armando vorher reservieren. Von der Piazza Navona sind es etwa 10 Minuten zu Fuß, das ist der letzte Fußweg des Tages. Ein schönes Abendessen, Zeit lassen." },
      { id: "m-trevi", time: "21:00", name: "Trevi-Brunnen (freiwillig)", where: "Fontana di Trevi", maps: "Fontana di Trevi Roma", note: "Nur wenn das Bein noch mitmacht, rund 10 Minuten zu Fuß vom Essen. Abends beleuchtet und leerer als tagsüber. Münze mit der rechten Hand über die linke Schulter. Zurück zur Unterkunft mit dem Taxi." }
    ]},
    { id: "di", label: "Di 27.10.", title: "Feuer, Luft und das Versteck", role: "Navigator: Metro A bis Ottaviano, dann zu Fuß zum Petersplatz.", stops: [
      { id: "d-vittoria", time: "08:30", name: "Santa Maria della Vittoria", where: "Via XX Settembre 17", maps: "Santa Maria della Vittoria Via XX Settembre 17 Roma", seal: "fire", note: "Von der Unterkunft nicht laufen: Metro A ab Termini nur eine Station bis Repubblica, dann rund 5 Minuten zu Fuß. Öffnungszeiten laut Quelle 7 bis 12 Uhr. Leise sein.", puzzle: {
        title: "Siegel des Feuers", intro: "Ort Nummer drei. In der linken Seitenkapelle steht eine Marmor-Szene wie auf einer Bühne, mit goldenen Strahlen.",
        steps: [
          { id: "vit1", q: "Ein lächelnder Engel hält etwas Spitzes in der Hand und zielt auf das Herz der Frau. Was ist es?", accept: ["pfeil", "speer", "lanze", "spear", "arrow"], hints: ["Es ist golden.", "Man schießt oder wirft es."], reveal: "Ein goldener Pfeil, auch Speer genannt. Er steht für die göttliche Liebe, die die Heilige trifft." },
          { id: "vit2", q: "Wie heißt die Heilige, deren Verzückung Bernini hier dargestellt hat?", accept: ["teresa", "theresa", "therese", "teresia"], hints: ["Sie kam aus Ávila in Spanien.", "Der Name beginnt mit T und endet auf a."], reveal: "Teresa von Ávila. Bernini schuf die Gruppe um 1650. Das Zeichen des Feuers ist ein Dreieck mit der Spitze nach oben." },
          { id: "vit3", viz: "tl|1647|1652|Bernini beginnt|fertig", q: "Bernini arbeitete von 1647 bis 1652 an dieser Szene. Wie viele Jahre waren das?", accept: ["5", "funf", "fuenf"], hints: ["1652 minus 1647.", "Es sind weniger als zehn Jahre."], reveal: "Fünf Jahre für eine einzige Marmorgruppe." }
        ], outro: "Siegel des Feuers gesichert." } },
      { id: "d-metro", time: "09:10", name: "Metro zum Vatikan", where: "Metro A ab Repubblica Richtung Battistini bis Ottaviano", maps: "Ottaviano metro Roma", note: "Navigator: Repubblica Teatro dell'Opera einsteigen, Ottaviano aussteigen, ohne Umsteigen. Von dort sind es rund 10 Minuten flach bis zum Petersplatz, mit Pausen." },
      { id: "d-platz", time: "09:45", name: "Petersplatz", where: "Zwischen Obelisk und Petersdom", maps: "Piazza San Pietro Roma", seal: "air", note: "Sicherheitskontrolle beim Petersdom, kleiner Rucksack.", puzzle: {
        title: "Siegel der Luft", intro: "Ort Nummer vier. Der Platz ist ein riesiges Oval, und im Boden stecken Markierungen für die Winde.",
        steps: [
          { id: "luft1", viz: "compass", q: "Rund um den Obelisken liegen 16 weiße Marmorplatten im Pflaster, jede mit einem Windnamen. Auf einer steht Ponente. Welche Himmelsrichtung ist das?", accept: ["west", "westen"], hints: ["Ponente ist italienisch für Sonnenuntergang.", "Wo geht die Sonne unter?"], reveal: "Westen. Die 16 Platten bilden zusammen eine Windrose um den Obelisken." },
          { id: "luft2", q: "Der Obelisk in der Mitte ist älter als der Petersdom. Aus welchem Land stammt er?", accept: ["agypten", "aegypten", "ägypten", "egypt"], hints: ["Dort stehen die Pyramiden.", "Das Land liegt am Nil."], reveal: "Ägypten. Er kam unter Kaiser Caligula nach Rom und wurde 1586 auf diesem Platz aufgestellt. Das Zeichen der Luft ist ein Dreieck mit der Spitze nach oben und einem Querstrich." },
          { id: "luft3", q: "Die Kolonnaden um den Platz haben 284 Säulen. Sie stehen immer vier nebeneinander in einer Reihe. Wie viele Säulenreihen sind es?", accept: ["71"], hints: ["Teile 284 durch 4.", "Erst 280 durch 4, dann noch 4 durch 4."], reveal: "71 Reihen. Oben auf den Kolonnaden stehen 140 Heilige als Statuen." }
        ], outro: "Siegel der Luft gesichert." } },
      { id: "d-dom", time: "10:15", name: "Petersdom", where: "Eintritt frei, Schultern und Knie bedeckt", maps: "Basilica di San Pietro Roma", note: "Gleich rechts am Eingang steht die Pietà. Danach die Markierungen im Boden suchen, die Länge anderer Kirchen zeigen. Vor dem Eingang gibt es eine Sicherheitskontrolle, die Schlange kann dauern. Leonard soll sich zwischendurch setzen, wo es geht.", puzzle: {
        title: "Die Pietà", intro: "Ein junger Künstler, ein Block Marmor, eine Mutter mit ihrem Sohn.",
        steps: [{ id: "dom1", q: "Wer hat die Pietà geschaffen, als er noch als junger Mann?", accept: ["michelangelo"], hints: ["Er hat auch den Moses gemacht.", "Er malte die Sixtinische Decke."], reveal: "Michelangelo. Er ist der einzige Künstler, der ein Werk hier mit seinem Namen signiert hat, auf dem Band über der Brust (so wird es erzählt)." },
          { id: "dom2", viz: "tl|1475|1499|Michelangelo geboren|Pietà fertig", q: "Michelangelo wurde 1475 geboren und vollendete die Pietà 1499. Wie alt war er?", accept: ["24"], hints: ["1499 minus 1475.", "Er war noch keine 25."], reveal: "24 Jahre. Mit 24 hat er ein Meisterwerk gemacht, das bis heute Millionen sehen." }] } },
      { id: "d-essen1", time: "11:45", name: "Mittagessen", where: "Pizzarium Bonci, Via della Meloria 43, ab Ottaviano eine Station Metro A bis Cipro", maps: "Pizzarium Bonci Via della Meloria 43 Roma", note: "Metro A ab Ottaviano eine Station bis Cipro, dann rund 5 Minuten zu Fuß. Pizza al taglio, günstig und sehr gut. Heute früh essen und nicht lange sitzen bleiben. Kassenwart ist heute dran." },
      { id: "d-burg", time: "13:00", name: "Engelsburg", where: "Castel Sant'Angelo, von außen und von der Ponte Sant'Angelo aus", maps: "Castel Sant'Angelo Roma", finale: true, note: "Vom Mittagessen mit dem Taxi (rund 10 Minuten). Drinnen gibt es viele Treppen und Rampen, deshalb heute nur von außen und von der Brücke aus. Die Engelsstatue oben seht ihr von dort. Rein nur, wenn Leonards Bein mitmacht: Öffnet dienstags laut Quelle 9 bis 19:30, Erwachsene zahlen Eintritt, Kinder unter 18 laut Quelle frei.", puzzle: {
        title: "Das Versteck", intro: "Alle vier Siegel zeigen auf eine Burg am Fluss. Früher Grabmal für einen Kaiser, später Festung der Päpste mit geheimem Fluchtweg. Finale!",
        steps: [
          { id: "fin1", q: "Oben auf der Burg steht ein Engel mit Schwert. Welcher Erzengel ist es?", accept: ["michael"], hints: ["Er ist der Anführer der Engel.", "Sein Name endet auf el."], reveal: "Der Erzengel Michael. Der Legende nach sah Papst Gregor der Große hier im Jahr 590 den Engel sein Schwert einstecken, und die Pest endete. Daher der Name Engelsburg." },
          { id: "fin2", q: "Ein befestigter Gang verbindet die Burg mit dem Vatikan. Er heißt Passetto di ... Wie geht der Name weiter?", accept: ["borgo"], hints: ["Borgo ist der Name des alten Viertels um den Vatikan.", "Es sind fünf Buchstaben."], reveal: "Passetto di Borgo. Papst Clemens VII. floh 1527 auf diesem Weg vor plündernden Soldaten." },
          { id: "fin3", viz: "walk", q: "Der Gang ist rund 800 Meter lang. Wie viele Minuten brauchst du dafür zu Fuß bei 4 km/h?", accept: ["12"], hints: ["4 km/h sind 4000 Meter in 60 Minuten.", "Das sind rund 67 Meter pro Minute."], reveal: "12 Minuten. Der Papst musste 1527 um sein Leben rennen, ihr könnt es gemütlicher angehen. Fall gelöst." }
        ], outro: "Das Versteck ist gefunden." } },
      { id: "d-hotel", time: "14:30", name: "Pause in der Unterkunft", where: "Napoleone Suite, Via Napoleone III 28", maps: "Via Napoleone III 28, Roma", note: "Mit dem Taxi zurück. Bein hochlegen, ausruhen, Fotos sortieren. Bis kurz vor 17 Uhr ist frei." },
      { id: "d-trast", time: "17:30", name: "Trastevere", where: "Piazza und Kirche Santa Maria in Trastevere, ein paar flache Gassen", maps: "Santa Maria in Trastevere Roma", note: "Mit dem Taxi hin (rund 15 Minuten). Den Gianicolo-Hügel lasst ihr weg. Fotograf: Fünf Bilder zum Thema Licht und Schatten, abends ist es besonders schön. Eis oder Grattachecca gegen 18:15." },
      { id: "d-essen2", time: "19:30", name: "Abendessen", where: "Da Enzo al 29 oder Tonnarello", maps: "Da Enzo al 29 Via dei Vascellari 29 Roma", note: "Da Enzo nimmt keine Reservierung, die Schlange beginnt ab 19 Uhr. Papa stellt sich an, Leonard setzt sich solange auf eine Bank in der Nähe. Alternative Tonnarello. Zurück zur Unterkunft mit dem Taxi." }
    ]},

      { id: "w-barb", time: "08:30", name: "Epilog am Tritonbrunnen", where: "Piazza Barberini, etwa 15 bis 20 Minuten zu Fuß von Termini", maps: "Fontana del Tritone Roma", note: "Freiwillig. Zurück in der Unterkunft um 9:45, Check-out spätestens 10:30.", puzzle: {

          { id: "bar2", viz: "tl|1643|2026|Brunnen fertig|Heute", q: "Der Brunnen wurde 1643 fertig. Wie viele Jahre sind das bis 2026?", accept: ["383"], hints: ["2026 minus 1643.", "2026 minus 1600 ist 426, dann 43 abziehen."], reveal: "383 Jahre. Rechenprofi." }] } },

      { id: "w-zug1", time: "11:20", name: "Rom nach Bologna", where: "Frecciarossa 9628, Ankunft Bologna Centrale 13:23", maps: "Roma Termini", note: "Am Bahnhof um 10:50 sein. Navigator: Gleis auf der Tafel suchen." },
      { id: "w-zug2", time: "13:52", name: "Bologna nach Innsbruck", where: "Railjet 82 über Verona und Brenner, Ankunft Innsbruck Hbf 18:32", maps: "Bologna Centrale", note: "Nur 29 Minuten Umstieg in Bologna. Gleis des RJ 82 sofort auf der Tafel suchen und direkt hingehen." }

  var KNOW = {"m-pantheon": {"why": "Das Pantheon ist fast 1900 Jahre alt und eines der am besten erhaltenen Gebäude der Antike. Kaiser Hadrian ließ es um das Jahr 125 bauen, als Tempel für alle Götter. Heute ist es eine Kirche. Berühmt ist die Kuppel aus Beton ohne Stahl: Sie ist bis heute die größte ihrer Art. Innen ist sie rund 43 Meter breit und genauso hoch, eine riesige Kugel würde also genau hineinpassen.", "see": ["Das Oculus ganz oben ist das einzige Fenster. Bei Regen wird der Boden nass, kleine Löcher im Boden leiten das Wasser ab.", "Vorne tragen 16 riesige Granitsäulen das Dach, jede aus einem einzigen Stein.", "Die vertieften Felder in der Kuppel (Kassetten) sparen Gewicht.", "Hier liegen Raffael und zwei Könige von Italien begraben."]}, "m-moses": {"why": "Die Kirche heißt San Pietro in Vincoli, also Sankt Petrus in Ketten. Dort werden der Überlieferung nach die Ketten aufbewahrt, mit denen der Apostel Petrus gefesselt war. Der eigentliche Star ist aber der Moses von Michelangelo, entstanden um 1513 bis 1515 für das Grabmal von Papst Julius II. Das Grabmal wurde viel kleiner als geplant. Der Moses ist der Teil, den alle sehen wollen.", "see": ["Die Hörner auf dem Kopf und der lange Bart, der aus Marmor wie echtes Haar aussieht.", "Die Muskeln der Arme und die Adern an den Händen.", "Die Ketten des Petrus liegen in einem Schrein unter dem Altar.", "Eine Legende erzählt, Michelangelo habe dem fertigen Moses aufs Knie geschlagen und gerufen: Warum sprichst du nicht? Das ist wohl nur eine Geschichte."]}, "m-forum": {"why": "Das Forum Romanum war über Jahrhunderte der Mittelpunkt von Rom. Hier tagte der Senat, hier hielten Politiker Reden, hier standen Tempel und Märkte, und hier feierten Feldherren ihre Siege. Heute sieht man vor allem Ruinen. Stellt euch dafür eine laute, volle Innenstadt vor.", "see": ["Die Via Sacra, die Heilige Straße, auf der Siegeszüge zum Kapitol zogen.", "Der Titusbogen, der den Sieg über Jerusalem feiert.", "Säulenreste und Tempelstufen. Das Backsteingebäude der Curia, wo der Senat tagte, ist gut erhalten, wenn ihr daran vorbeikommt."]}, "m-kolo": {"why": "Das Kolosseum wurde unter Kaiser Vespasian begonnen und von seinem Sohn Titus im Jahr 80 eröffnet. Es ist das größte Amphitheater der Römer. Hier gab es Gladiatorenkämpfe und Tierhetzen, und es bot Platz für rund 50.000 Zuschauer (Schätzungen schwanken). Den Namen erklärt man meist mit einer riesigen Statue von Kaiser Nero, die in der Nähe stand.", "see": ["Drei Reihen Bögen und darüber eine Wand: Unten sind die Säulen schlicht, nach oben werden sie verzierter.", "Über den Bögen im Erdgeschoss stehen römische Zahlen. Das waren die Nummern der Eingänge.", "Die vielen Löcher in den Steinen stammen von Metallklammern, die man später herausgeholt hat."]}, "m-smm": {"why": "Santa Maria Maggiore ist eine der vier großen Papstbasiliken Roms und die größte Marienkirche der Stadt. Die Kirche stammt aus dem 5. Jahrhundert. Einer Legende nach schneite es mitten im Sommer auf dem Hügel, und der Papst baute die Kirche genau dort. Jedes Jahr im August erinnert ein Fest daran, bei dem weiße Blütenblätter von oben fallen.", "see": ["Die goldene Decke. Man erzählt, sie sei mit dem ersten Gold aus Amerika vergoldet worden.", "Goldene Mosaike aus dem 5. Jahrhundert ganz oben an den Wänden des Mittelschiffs.", "Der Glockenturm ist mit rund 75 Metern der höchste in Rom.", "Auf dem Platz vor der Kirche steht eine Säule mit einer Marienstatue. Die Säule stammt aus einem antiken Gebäude am Forum."]}, "m-popolo": {"why": "Santa Maria del Popolo steht an einem der berühmtesten Plätze Roms, dem Eingang zur Stadt für alle, die aus dem Norden kamen. Die Kirche ist ein Schatzkästchen: In der Chigi-Kapelle haben Raffael (Entwurf) und Bernini gearbeitet, und in der Cerasi-Kapelle hängen zwei Bilder von Caravaggio.", "see": ["Die Chigi-Kapelle mit der Kuppel nach Raffaels Entwurf und den Statuen von Bernini.", "Die Cerasi-Kapelle links vom Hauptaltar mit zwei dunklen Bildern von Caravaggio. Das Licht wirkt darin wie ein Scheinwerfer.", "Draußen steht ein ägyptischer Obelisk, der über 3000 Jahre alt ist und früher im Circus Maximus stand."]}, "m-navona": {"why": "Die Piazza Navona ist so lang und oval, weil hier um das Jahr 86 ein Stadion von Kaiser Domitian stand, in dem Sportwettkämpfe stattfanden. Die Häuser stehen auf den alten Tribünen. Seit dem 17. Jahrhundert schmücken prächtige Brunnen und Barockkirchen den Platz, und er war lange ein Ort für Feste.", "see": ["Drei Brunnen: den Neptunbrunnen im Norden, den Vier-Ströme-Brunnen in der Mitte und den Mohrenbrunnen im Süden.", "Jeder Flussgott steht für einen Kontinent: Nil für Afrika, Ganges für Asien, Donau für Europa, Rio de la Plata für Amerika.", "Die Kirche Sant'Agnese mit der geschwungenen Fassade von Borromini. Eine beliebte Geschichte erzählt, die Statuen zuckten vor ihr zurück. Das stimmt aber wohl nicht, denn der Brunnen war früher fertig."]}, "m-trevi": {"why": "Der Trevi-Brunnen ist der größte Barockbrunnen Roms und einer der berühmtesten der Welt. Er wurde nach Plänen von Nicola Salvi gebaut und 1762 eingeweiht. Sein Wasser kommt aus einer antiken Wasserleitung, der Aqua Virgo, die schon vor über 2000 Jahren gebaut wurde.", "see": ["In der Mitte steht der Meeresgott auf einem Muschelwagen, den zwei Meerpferde ziehen. Eines ist ruhig, eines wild, wie die Stimmungen des Meeres.", "Der Münzwurf: Mit dem Rücken zum Brunnen die Münze mit der rechten Hand über die linke Schulter werfen. Wer das tut, kommt der Legende nach nach Rom zurück.", "Das Geld wird eingesammelt und für soziale Zwecke verwendet."]}, "d-vittoria": {"why": "In der kleinen Kirche Santa Maria della Vittoria steht eines der berühmtesten Kunstwerke des Barock: die Verzückung der heiligen Teresa von Bernini, geschaffen zwischen 1647 und 1652. Teresa von Ávila hatte eine Vision: Ein Engel stach ihr mit einem goldenen Pfeil ins Herz, und sie spürte Schmerz und überwältigende Liebe zu Gott. Bernini zeigt diesen Moment in Marmor, wie auf einer Bühne.", "see": ["Das Gewand der Heiligen. Der Marmor sieht aus wie echter, fließender Stoff.", "Die goldenen Strahlen hinter der Gruppe. Das Licht kommt von einem verborgenen Fenster darüber.", "Links und rechts sitzen Figuren in Logen wie im Theater und schauen zu."]}, "d-platz": {"why": "Der Petersplatz liegt vor dem Petersdom. Gian Lorenzo Bernini hat ihn zwischen 1656 und 1667 gebaut. Die beiden Halbkreise aus Säulen sollen wie zwei Arme sein, die die Besucher umarmen. Wenn der Papst spricht, versammeln sich hier Zehntausende Menschen.", "see": ["Der ägyptische Obelisk in der Mitte ist rund 25 Meter hoch, mit Sockel und Kreuz über 40.", "Zwei Brunnen links und rechts davon.", "Zwei runde Steine im Pflaster. Wer sich daraufstellt, sieht die vier Säulenreihen genau hintereinander.", "Oben auf den Kolonnaden stehen 140 Heilige als Statuen.", "Rechts im Apostolischen Palast liegt das Fenster, an dem der Papst sonntags zum Gebet erscheint."]}, "d-dom": {"why": "Der Petersdom ist die größte Kirche der Christenheit. Er steht über dem Grab des Apostels Petrus. Der heutige Bau entstand zwischen 1506 und 1626 und beschäftigte die größten Künstler ihrer Zeit, darunter Bramante, Michelangelo und Bernini. Michelangelo entwarf die Kuppel, die fast so breit ist wie die des Pantheons, aber viel höher liegt.", "see": ["Die Pietà gleich rechts am Eingang, heute hinter Glas.", "Der riesige Bronze-Baldachin über dem Hauptaltar, rund 29 Meter hoch, so hoch wie ein zehnstöckiges Haus.", "Im Boden des Mittelschiffs stehen die Längen anderer großer Kirchen. So sieht man, wie riesig der Petersdom ist.", "Die Bronzestatue des heiligen Petrus mit dem glattgeriebenen Fuß."]}, "d-burg": {"why": "Die Engelsburg war ursprünglich das Grabmal von Kaiser Hadrian, fertiggestellt im Jahr 139. Später wurde sie Festung, Gefängnis und Zufluchtsort der Päpste. Über den Fluchtgang Passetto di Borgo rettete sich 1527 Papst Clemens VII. Oben steht der Erzengel Michael mit seinem Schwert. Auch die Oper Tosca von Puccini endet auf dieser Burg.", "see": ["Die runde, wuchtige Form mit den dicken Mauern und der Engelsstatue oben auf der Spitze.", "Die Ponte Sant'Angelo davor mit zehn Engeln, die unter der Leitung von Bernini entstanden.", "Von der Brücke aus hat man den besten Blick auf die Burg und den Fluss."]}, "d-trast": {"why": "Trastevere heißt jenseits des Tibers (lateinisch trans Tiberim), denn das Viertel liegt am westlichen Flussufer. Es gilt als eines der gemütlichsten Viertel Roms, mit engen Gassen, Efeu an den Wänden und vielen kleinen Läden. Die Kirche Santa Maria in Trastevere gehört zu den ältesten Marienkirchen der Stadt, ihre goldenen Mosaike glänzen im Licht.", "see": ["Die Piazza mit dem achteckigen Brunnen und der Kirche mit dem goldenen Mosaik an der Fassade.", "Die goldenen Mosaike in der Apsis über dem Altar.", "Bunte Hauswände, Efeu und Lichter in den Gassen, besonders schön am Abend."]}};
  var BONUS = {"m-pantheon": {"steps": [{"id": "pan3", "q": "Zähle die Säulen in der ersten Reihe der Vorhalle, ganz vorne am Eingang. Wie viele sind es?", "accept": ["8", "acht"], "hints": ["Zähle nur die vorderste Reihe, von links nach rechts.", "Es sind mehr als sechs und weniger als zehn."], "reveal": "Acht Säulen stehen vorne in einer Reihe, dahinter folgen zwei Gruppen mit je vier. Zusammen sind es 16 Granitsäulen."}]}, "m-moses": {"steps": [{"id": "mos2", "q": "Die Kirche heißt San Pietro in Vincoli, vincoli heißt Fesseln oder Ketten. Was von Petrus wird hier aufbewahrt?", "accept": ["ketten", "kette", "fessel"], "hints": ["Gefangene tragen sie an den Händen oder Füßen.", "Es ist ein Wort mit K, das auch am Fahrrad hängt."], "reveal": "Die Ketten des Petrus. Der Überlieferung nach lagen sie in Jerusalem und in Rom, und als man sie aneinanderhielt, sollen sie sich zu einer Kette verbunden haben."}, {"id": "mos3", "q": "Michelangelo schuf den Moses für das Grabmal eines Papstes. Es wurde viel kleiner als geplant. Wie hieß der Papst mit Vornamen?", "accept": ["julius", "giulio"], "hints": ["Sein Name erinnert an den Monat Juli.", "Er war ein kämpferischer Papst und hieß wie der Julikalender."], "reveal": "Julius II. Er wollte ein riesiges Grabmal mit rund 40 Statuen. Gebaut wurde nur ein Teil davon, und der Moses ist der berühmteste."}]}, "m-forum": {"steps": [{"id": "for3", "q": "Wie heißt die berühmteste Straße im Forum, auf der Siegeszüge zum Kapitol zogen? Auf Deutsch: Die Heilige Straße.", "accept": ["via sacra", "sacra", "heilige strasse"], "hints": ["Sie führt am Titusbogen vorbei.", "Das lateinische Wort sacra bedeutet heilig."], "reveal": "Die Via Sacra, die Heilige Straße. Bei einem Triumphzug führten die Sieger ihre Beute und ihre Gefangenen darüber zum Kapitol."}, {"id": "for4", "q": "Der Sage nach wurden die Gründer Roms, zwei Zwillinge, von einer Wölfin gesäugt. Einer hieß Romulus. Wie hieß sein Bruder?", "accept": ["remus"], "hints": ["Der Name klingt fast wie der seines Bruders.", "Er beginnt mit R und hat fünf Buchstaben."], "reveal": "Remus. Romulus soll der Sage nach im Jahr 753 vor Christus die Stadt gegründet und nach sich benannt haben."}]}, "m-kolo": {"steps": [{"id": "kol3", "q": "Das Wort Arena kommt vom lateinischen harena. Womit war der Boden des Kolosseums bedeckt?", "accept": ["sand"], "hints": ["Man kennt es vom Strand.", "Es besteht aus winzigen Körnern."], "reveal": "Sand. Er machte den Boden griffig und saugte Wasser und Blut auf. Das lateinische Wort harena bedeutet Sand."}, {"id": "kol4", "viz": "tl|80|2026|Eröffnung|Heute", "q": "Das Kolosseum wurde im Jahr 80 eröffnet. Wie alt ist es 2026?", "accept": ["1946"], "hints": ["Rechne 2026 minus 80.", "2026 minus 100 ist 1926, dann plus 20."], "reveal": "1946 Jahre. Es steht also seit fast 2000 Jahren hier."}]}, "m-smm": {"title": "Gold und Schnee", "intro": "Eine Kirche, die der Legende nach wegen eines Sommerwunders gebaut wurde. Schau nach oben und denk an Weihnachten.", "steps": [{"id": "smm1", "q": "Die goldene Decke soll mit dem ersten Gold aus einem neu entdeckten Kontinent vergoldet worden sein. Aus welchem?", "accept": ["amerika", "america"], "hints": ["Kolumbus erreichte ihn im Jahr 1492.", "Der Name beginnt mit A und hat sieben Buchstaben."], "reveal": "Aus Amerika. So wird es meist erzählt. Das Gold soll ein Geschenk des spanischen Königspaars an den Papst gewesen sein."}, {"id": "smm2", "q": "Der Legende nach fiel mitten im Sommer etwas vom Himmel, das dem Papst zeigte, wo die Kirche stehen soll. Was?", "accept": ["schnee"], "hints": ["Es ist weiß und kalt.", "Im Winter bauen Kinder daraus einen Mann."], "reveal": "Schnee, mitten im August. Deshalb heißt die Kirche auch Madonna della Neve, Madonna vom Schnee."}]}, "m-popolo": {"steps": [{"id": "pop3", "q": "In der Kirche hängen auch zwei berühmte Bilder von Caravaggio. Eines zeigt die Bekehrung des Paulus, das andere die Kreuzigung eines Apostels. Welcher Apostel war es?", "accept": ["petrus", "peter"], "hints": ["Er war der erste Papst und der Namensgeber des Petersdoms.", "Er wurde der Überlieferung nach mit dem Kopf nach unten gekreuzigt."], "reveal": "Petrus. Beide Bilder hängen in der Cerasi-Kapelle links vom Hauptaltar. Caravaggio malte mit starken Hell-Dunkel-Kontrasten, als würde ein Scheinwerfer auf die Szene fallen."}]}, "m-navona": {"steps": [{"id": "nav4", "q": "Der Platz ist so lang und oval, weil hier früher ein antikes Bauwerk für Sportwettkämpfe stand. Was für eins?", "accept": ["stadion"], "hints": ["Dort spielen heute Fußballmannschaften.", "Es beginnt mit St und hat sieben Buchstaben."], "reveal": "Ein Stadion von Kaiser Domitian. Die Häuser rund um den Platz stehen auf den alten Tribünen. Der Name Navona kommt vermutlich von den Wettkämpfen, den agones (so wird es meist erklärt)."}, {"id": "nav5", "q": "Wie viele Brunnen stehen auf der Piazza Navona? Der Vier-Ströme-Brunnen in der Mitte zählt mit.", "accept": ["3", "drei"], "hints": ["Einer in der Mitte, einer im Norden, einer im Süden.", "Es sind mehr als zwei und weniger als vier."], "reveal": "Drei: der Neptunbrunnen im Norden, der Vier-Ströme-Brunnen in der Mitte und der Mohrenbrunnen im Süden."}]}, "m-trevi": {"title": "Der Brunnen am Meer", "intro": "Ein Meeresgott, zwei Pferde und sehr viel Wasser. Schau dir die Mitte des Brunnens genau an.", "steps": [{"id": "tre1", "q": "Wie heißt der Gott in der Mitte des Brunnens, der auf einem Muschelwagen steht?", "accept": ["oceanus", "okeanos", "ozeanus", "neptun", "poseidon"], "hints": ["Er ist der Gott des Meeres.", "Sein Name beginnt mit O oder N."], "reveal": "Oceanus, der Gott des Meeres. Viele nennen ihn auch Neptun."}, {"id": "tre2", "q": "Der Muschelwagen wird von Meerpferden gezogen. Wie viele sind es?", "accept": ["2", "zwei"], "hints": ["Eines ist ruhig, eines ist wild.", "Es sind weniger als drei."], "reveal": "Zwei Meerpferde. Das ruhige und das wilde stehen für die zwei Stimmungen des Meeres. Tritonen führen sie."}, {"id": "tre3", "viz": "tl|1762|2026|Eingeweiht|Heute", "q": "Der Brunnen wurde 1762 eingeweiht. Wie alt ist er 2026?", "accept": ["264"], "hints": ["Rechne 2026 minus 1762.", "2026 minus 1700 ist 326, dann noch 62 abziehen."], "reveal": "264 Jahre. Das Wasser kommt aus der Aqua Virgo, einer Wasserleitung aus der Zeit um 19 vor Christus. Sie ist über 2000 Jahre alt."}]}, "d-vittoria": {"steps": [{"id": "vit4", "q": "Links und rechts neben der Szene sitzen Figuren in Logen wie im Theater. Zu welcher Familie gehören sie, der die Kapelle ihren Namen verdankt?", "accept": ["cornaro"], "hints": ["Der Auftraggeber war ein Kardinal aus Venedig.", "Der Name beginnt mit C und hat sieben Buchstaben."], "reveal": "Die Familie Cornaro. Kardinal Federico Cornaro ließ die Kapelle bauen, und seine Familie schaut aus Marmor-Logen zu, als wäre alles ein Theaterstück."}]}, "d-platz": {"steps": [{"id": "luft4", "q": "Links und rechts vom Obelisken steht je ein Springbrunnen. Wie viele Brunnen gibt es auf dem Platz?", "accept": ["2", "zwei"], "hints": ["Einer links, einer rechts vom Obelisken.", "Es sind weniger als drei."], "reveal": "Zwei Brunnen. Der eine stammt von Maderno, der andere ist ein Zwilling davon, den Bernini später gebaut hat."}, {"id": "luft5", "q": "Im Pflaster liegen zwei runde Steine zwischen Obelisk und Brunnen. Stell dich auf einen davon und schau zu den Säulen. Wie viele Säulenreihen siehst du?", "accept": ["1", "eins", "eine reihe", "nur eine"], "hints": ["Die vier Reihen stehen von dort genau hintereinander.", "Es ist die kleinste Zahl über null."], "reveal": "Nur eine. Bernini hat den Platz so geplant, dass von diesen Punkten die vier Säulenreihen genau hintereinander stehen und wie eine einzige aussehen."}]}, "d-dom": {"steps": [{"id": "dom3", "q": "Wer hat den riesigen Bronze-Baldachin über dem Hauptaltar entworfen, derselbe Mann, der den Petersplatz gebaut hat?", "accept": ["bernini", "gian lorenzo"], "hints": ["Er hat auch die heilige Teresa aus Marmor gemacht.", "Sein Name beginnt mit B."], "reveal": "Gian Lorenzo Bernini. Der Baldachin ist etwa so hoch wie ein zehnstöckiges Haus. Die Bronze soll zum Teil vom Dach des Pantheons stammen. Das wird erzählt, stimmt aber wohl nur teilweise."}, {"id": "dom4", "q": "Eine Bronzestatue des heiligen Petrus sitzt auf einem Thron. Ein Körperteil davon ist von Millionen Berührungen ganz glatt. Welcher?", "accept": ["fuss", "fuß"], "hints": ["Pilger streicheln oder küssen ihn.", "Er steht auf dem Boden."], "reveal": "Der Fuß. Über Jahrhunderte haben Besucher ihn berührt, bis er ganz abgerundet war."}]}, "d-burg": {"steps": [{"id": "fin4", "q": "Die Burg wurde ursprünglich als Grabmal für einen römischen Kaiser gebaut. Wie hieß er?", "accept": ["hadrian"], "hints": ["Er hat auch das Pantheon neu bauen lassen.", "Sein Name beginnt mit H."], "reveal": "Hadrian. Die Engelsburg war sein Mausoleum, fertig im Jahr 139. Später machten die Päpste eine Festung daraus."}]}, "d-trast": {"title": "Jenseits des Flusses", "intro": "Ein Viertel auf der anderen Seite des Flusses. Achte auf Wasser, Gold und Ecken.", "steps": [{"id": "tra1", "q": "Trastevere heißt lateinisch jenseits des ... Wie heißt der Fluss, der durch Rom fließt?", "accept": ["tiber", "tevere"], "hints": ["Er fließt auch unter der Engelsbrücke durch.", "Der Name beginnt mit T."], "reveal": "Der Tiber, auf Italienisch Tevere. Trastevere kommt von trans Tiberim, also jenseits des Tibers. Das Viertel liegt am westlichen Ufer."}, {"id": "tra2", "q": "Schau in der Kirche Santa Maria in Trastevere nach oben über den Altar. Welche Farbe hat der Hintergrund der großen Mosaike?", "accept": ["gold", "golden"], "hints": ["Sie glänzen im Licht.", "Es ist die Farbe von Kronen und Schätzen."], "reveal": "Gold. Die Mosaike bestehen aus tausenden winzigen Steinchen und stammen aus dem Mittelalter."}, {"id": "tra3", "q": "Auf dem Platz vor der Kirche steht ein Brunnen. Wie viele Ecken hat das Becken?", "accept": ["8", "acht"], "hints": ["Zähle die Kanten rund um den Brunnen.", "Es sind mehr als sechs und weniger als zehn."], "reveal": "Acht. Das Becken ist ein Achteck. Der Brunnen wurde im 17. Jahrhundert von Carlo Fontana erneuert."}]}};
  var SPECIAL = {"id": "d-spezial", "time": "09:45", "name": "Spezialsiegel in der Schlange", "where": "Petersplatz, aus der Warteschlange", "maps": "Piazza San Pietro Roma", "special": true, "note": "Freiwillig. 20 Fragen, die ihr beim Warten beantworten könnt. Wer alle löst, bekommt das Spezialsiegel.", "puzzle": {"title": "Das Spezialsiegel", "intro": "Ihr steht in der Schlange. Schaut euch um, zählt, lest und rechnet. Zwanzig Fragen, ein goldenes Siegel.", "steps": [{"id": "sp1", "q": "Wie heißt der Petersplatz auf Italienisch? Er beginnt mit Piazza.", "accept": ["san pietro", "pietro"], "hints": ["Piazza San ...", "Der zweite Name ist der Apostel Petrus auf Italienisch."], "reveal": "Piazza San Pietro. Pietro ist Italienisch für Petrus.", "bonus": true}, {"id": "sp2", "q": "Die Kolonnaden bestehen aus mehreren Säulenreihen nebeneinander. Wie viele sind es?", "accept": ["4", "vier"], "hints": ["Die Reihen stehen so, dass man vom Brennpunkt nur eine sieht.", "Es sind mehr als drei und weniger als fünf."], "reveal": "Vier Säulenreihen nebeneinander.", "bonus": true}, {"id": "sp3", "q": "Oben auf den Kolonnaden stehen Statuen von Heiligen. Wie viele sind es? Die Zahl hat drei Ziffern und endet auf 0.", "accept": ["140"], "hints": ["Es sind mehr als 100 und weniger als 200.", "Eine Zahl zwischen 130 und 150."], "reveal": "140 Heilige stehen oben auf den Kolonnaden.", "bonus": true}, {"id": "sp4", "q": "Gian Lorenzo Bernini hat den Platz gebaut. Mit welchem Vornamen beginnt sein Name?", "accept": ["gian"], "hints": ["Er beginnt mit G und hat vier Buchstaben.", "Gian Lorenzo Bernini."], "reveal": "Gian, also Gian Lorenzo Bernini.", "bonus": true}, {"id": "sp5", "q": "In welcher Sprache steht die große Inschrift oben auf der Fassade des Petersdoms?", "accept": ["latein"], "hints": ["Die Römer haben sie gesprochen.", "Sie wird heute fast nur noch in der Kirche und in der Wissenschaft benutzt."], "reveal": "Latein. Die Inschrift nennt Papst Paul V., der die Fassade bauen gs mittags am Fenster? Das Wort beginnt mit A und ist lateinisch.", "accept": ["angelus"], "hints": ["Es heißt wie ein Engel auf Latein.", "Es beginnt mit Ang."], "reveal": "Angelus. Der Papst erscheint am Fenster des Apostolischen Palastes.", "bonus": true}]}};

    h += "<p><b>" + held + " von 4 Siegeln</b>" + (stopDone(finaleStop()) ? ", Versteck gefunden." : ".") + "</p>";
    if (nx) {
      h += '<div class="stop-actions"><button class="btn" data-act="goto" data-d="' + nx.day.id + '" data-s="' + nx.stop.id + '">Weiter: ' + esc(nx.stop.name) + '</button></div>';
      h += '<p class="small muted">' + esc(nx.day.label) + ", " + esc(nx.stop.time) + " Uhr, " + esc(nx.stop.where) + "</p>";
    } else h += "<p>Alles gelöst. Du bist der Boss.</p>";
    h += "</section>";
    h += '<section class="card"><span class="mono">Route</span>' + routeMap() + '<p class="small muted">Gefüllte Kreise sind gesicherte Orte. Montag oben links, Dienstag unten.</p></section>';
    h += jokeHTML(FALLJ[(Object.keys(S.done).length) % FALLJ.length]);
    h += '<section class="card"><span class="mono">Nutzung</span><p class="small muted">Dein Fortschritt bleibt auf diesem Handy gespeichert. Öffne die App am besten immer in Safari. Karten-Links öffnen Google Maps.</p></section>';
    return h;
  }

  function knowHTML(s) {
    if (!s.know) return "";
    var h = '<details class="know"><summary>Warum berühmt? Was gibt es zu entdecken?</summary><p class="small">' + esc(s.know.why) + "</p>";
    if (s.know.see && s.know.see.length) h += '<p class="mono know-h">Das könnt ihr entdecken</p><ul class="plain small">' + s.know.see.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>";
    return h + "</details>";
  }
  function stopCard(d, s) {
    var done = s.puzzle && stopDone(s), locked = s.finale && sealsHeld().length < 4;
    var h = '<div class="stop"><div class="t">' + esc(s.time) + '</div><div class="body' + (done ? " done" : "") + '" id="st-' + s.id + '"><div class="hd"><span class="badge">' + ico(ICBY[s.id]) + '</span><div><h3>' + esc(s.name) + '</h3><p class="small muted">' + esc(s.where) + "</p></div></div>";
    var tags = "";
    if (s.seal) tags += '<span class="tag ' + s.seal + '">Siegel ' + ELEM[s.seal].name + "</span>";
    if (s.finale) tags += '<span class="tag finale">Finale</span>';
    if (s.puzzle && !s.seal && !s.finale) tags += '<span class="tag">' + (bonusOnly(s) ? "Bonus-Rätsel" : "Rätsel") + "</span>";
    if (done) tags += '<span class="tag ok">gelöst</span>';
    if (done && !bonusOnly(s) && bonusOpen(s)) tags += '<span class="tag">Bonus offen</span>';
    if (tags) h += '<div class="tags">' + tags + "</div>";
    if (s.note) h += '<p class="small">' + esc(s.note) + "</p>";
    h += knowHTML(s);
    h += '<div class="stop-actions">';
    if (s.puzzle) h += '<button class="btn' + (locked ? " dim" : "") + '" data-act="puzzle" data-s="' + s.id + '">' + (done ? (!bonusOnly(s) && bonusOpen(s) ? "Bonusfragen" : "Rätsel ansehen") : locked ? "Gesperrt, erst vier Siegel" : bonusOnly(s) ? "Bonus-Rätsel starten" : "Rätsel starten") + "</button>";
    h += '<a class="btn ghost" href="' + mapsUrl(s.maps) + '" target="_blank" rel="noopener">In Google Maps öffnen</a></div></div></div>';
    return h;
  }
  function viewTour() {
    var d = DAYS.filter(function (x) { return x.id === S.day; })[0] || DAYS[0];
    var h = '<div class="chips" role="group" aria-label="Tag wählen">' + DAYS.map(function (x) { return '<button class="chip" data-act="day" data-v="' + x.id + '" aria-pressed="' + (x.id === d.id) + '">' + esc(x.label) + "</button>"; }).join("") + "</div>";
    h += '<div class="daybox"><h2>' + esc(d.title) + '</h2><p class="small muted">' + esc(d.role) + "</p></div>";
    h += '<div class="timeline">' + d.stops.map(function (s) { return stopCard(d, s); }).join("") + "</div>";
    return h;
  }

  function viewSeals() {
    var held = sealsHeld(), h = '<div class="seal-grid">';
    ORDER.forEach(function (k) {
      var st = sealStop(k), on = held.indexOf(k) >= 0;
      h += '<div class="seal-cell">' + sealSVG(k, on) + "<b>" + ELEM[k].name + '</b><span class="small muted">' + (on ? "gesichert" : esc(st.name)) + "</span></div>";
    });
    h += "</div>";
    var sp = STOPS["d-spezial"], spOn = !!sp && sp.puzzle.steps.every(function (x) { return !!S.done[x.id]; }), spN = sp ? sp.puzzle.steps.filter(function (x) { return !!S.done[x.id]; }).length : 0;
    h += '<div class="seal-cell" style="margin-bottom:12px">' + finaleSVG(spOn) + '<b>Spezialsiegel Petersplatz</b><span class="small muted">' + (spOn ? "gesichert, 20 von 20" : spN + " von 20 Fragen") + "</span></div>";
    var fin = stopDone(finaleStop());
    h += '<div class="seal-cell">' + finaleSVG(fin) + "<b>Das Versteck</b><span class=\"small muted\">" + (fin ? "gefunden: Engelsburg" : sealsHeld().length < 4 ? "noch " + (4 - sealsHeld().length) + " Siegel fehlen" : "bereit für das Finale") + "</span></div>";
    h += '<section class="card"><span class="mono">Punkte</span><p><b>' + total() + " von " + maxPts() + "</b>. Pro Frage gibt es 3 Punkte, jeder Tipp kostet einen. Bonusfragen zählen mit, sind aber freiwillig.</p></section>";
    h += '<section class="card"><span class="mono">Notizbuch</span><div class="notes">';
    if (!S.notes.length) h += '<p class="muted small">Noch leer. Jede gelöste Frage legt hier einen Eintrag an.</p>';
    S.notes.forEach(function (n) { h += '<div class="note"><b>' + esc(n.t) + "</b><br>" + esc(n.r) + "</div>"; });
    h += "</div></section>";
    return h;
  }

  function h53(s) { var a = 0xdeadbeef, b = 0x41c6ce57; for (var i = 0; i < s.length; i++) { var c = s.charCodeAt(i); a = Math.imul(a ^ c, 2654435761); b = Math.imul(b ^ c, 1597334677); } a = Math.imul(a ^ (a >>> 16), 2246822507) ^ Math.imul(b ^ (b >>> 13), 3266489909); b = Math.imul(b ^ (b >>> 16), 2246822507) ^ Math.imul(a ^ (a >>> 13), 3266489909); return (4294967296 * (2097151 & b) + (a >>> 0)).toString(36); }
  var PIN_HASH = "16bieekht03";
  function tryPin() {
    var inp = document.getElementById("pin"), v = inp ? inp.value.replace(/\s/g, "") : "";
    if (h53("rom-eltern:" + v) === PIN_HASH) { S.unlocked = true; S.pinMsg = ""; render(); }
    else { S.pinMsg = "Falscher Code."; render(true); }
  }
  function viewPin() {
    return '<section class="card"><span class="mono">Für Eltern</span><p class="small">Dieser Bereich ist mit einem Code geschützt.</p><input type="password" id="pin" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="12" placeholder="Code" aria-label="Code"><p class="msg bad small" role="status">' + esc(S.pinMsg) + '</p><button class="btn" data-act="pin">Öffnen</button></section>';
  }
  function viewEltern() {
    if (!S.unlocked) return viewPin();
    var h = '<section class="card"><span class="mono">Für Eltern</span><p class="small">Hier stehen Hinweise zu Tickets, Zeiten und Lösungen. Öffnungszeiten stammen aus Reisequellen und sind nicht amtlich geprüft. Stand der Recherche: 20.10.2026.</p></section>';
    PARENT.forEach(function (p) {
      h += "<details><summary>" + esc(p.day) + "</summary>" + p.items.map(function (i) { return '<div class="kv"><b>' + esc(i[0]) + "</b><span>" + esc(i[1]) + "</span></div>"; }).join("") + "</details>";
    });
    h += "<details><summary>Lösungen aller Rätsel</summary><ul class=\"plain\">";
    DAYS.forEach(function (d) { d.stops.forEach(function (s) { if (s.puzzle) s.puzzle.steps.forEach(function (st) { h += "<li><b>" + esc(s.name) + ":</b> " + esc(st.accept[0].charAt(0).toUpperCase() + st.accept[0].slice(1)) + "</li>"; }); }); });
    h += "</ul></details>";
    h += '<section class="card"><span class="mono">Fortschritt</span>';
    if (!S.resetAsk) h += '<button class="btn ghost" data-act="reset-ask">Fortschritt zurücksetzen</button>';
    else h += '<p class="small">Wirklich alles löschen? Siegel, Punkte und Notizbuch gehen verloren.</p><div class="row"><button class="btn" data-act="reset-yes">Ja, löschen</button><button class="btn ghost" data-act="reset-no">Abbrechen</button></div>';
    h += "</section>";
    return h;
  }

  function qLabel(st, i, p, withTotal) {
    if (st.bonus) return "Bonusfrage";
    return "Frage " + (i + 1) + (withTotal ? " von " + p.steps.filter(function (x) { return !x.bonus; }).length : "");
  }
  function viewPuzzle() {
    var s = STOPS[S.view], p = s.puzzle, locked = s.finale && sealsHeld().length < 4, h = "";
    h += '<button class="btn ghost back" data-act="back">Zurück zur Tour</button>';
    h += '<section class="card hero"><div class="tags">' + (s.seal ? '<span class="tag ' + s.seal + '">Siegel ' + ELEM[s.seal].name + "</span>" : s.finale ? '<span class="tag finale">Finale</span>' : '<span class="tag">' + (bonusOnly(s) ? "Bonus-Rätsel" : "Rätsel") + "</span>") + "</div>";
    h += "<h2>" + esc(p.title) + '</h2><p class="muted">' + esc(s.name) + ", " + esc(s.where) + "</p>";
    h += '<div class="scene">' + scene(s) + '</div><p class="letter">' + esc(p.intro) + "</p></section>";
    h += knowHTML(s);
    if (locked) {
      h += '<section class="card locked"><p>Das Finale ist noch zu. Erst alle vier Siegel holen. Es fehlen noch ' + (4 - sealsHeld().length) + ".</p></section>";
      return h;
    }
    var shown = false;
    p.steps.forEach(function (st, i) {
      if (S.done[st.id]) {
        h += '<section class="card"><span class="mono">' + qLabel(st, i, p, false) + "</span><p>" + esc(st.q) + '</p><div class="reveal"><b>' + (S.pts[st.id] > 0 ? "Läuft, " + S.pts[st.id] + (S.pts[st.id] === 1 ? " Punkt" : " Punkte") : "Aufgelöst") + "</b><span>" + esc(st.reveal) + "</span></div></section>";
      } else if (!shown) {
        shown = true;
        var nh = S.hints[st.id] || 0, m = S.msg[st.id];
        h += '<section class="card step"><span class="mono">' + qLabel(st, i, p, true) + '</span>' + vizHTML(st.viz) + '<p class="q">' + esc(st.q) + "</p>";
        h += '<label class="small muted" for="ans">Deine Antwort</label><input type="text" id="ans" data-step="' + st.id + '" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" value="' + esc(S.draft[st.id] || "") + '">';
        h += '<div class="msg ' + (m ? m.k : "") + '">' + (m ? esc(m.t) : "") + "</div>";
        for (var j = 0; j < nh; j++) h += '<div class="hint"><b>Tipp ' + (j + 1) + ":</b> " + esc(st.hints[j]) + "</div>";
        h += '<div class="row"><button class="btn" data-act="check" data-step="' + st.id + '">Prüfen</button>';
        if (nh < st.hints.length) h += '<button class="btn ghost" data-act="hint" data-step="' + st.id + '">Tipp zeigen</button>';
        h += "</div>";
        if (nh >= st.hints.length) h += '<button class="btn dim" data-act="giveup" data-step="' + st.id + '">Ich checke es nicht, Lösung zeigen</button>';
        h += "</section>";
      }
    });
    if (stopDone(s)) {
      h += '<section class="card seal-win">';
      if (s.seal) h += sealSVG(s.seal, true) + "<h2>Siegel der " + ELEM[s.seal].name + "</h2>";
      else if (s.finale) h += finaleSVG(true) + "<h2>Fall gelöst</h2>";
      else h += "<h2>Station geschafft</h2>";
      h += "<p class=\"muted\">" + esc(p.outro || "Gut gemacht, Symbologe. Läuft.") + "</p>" + (JOKES[s.id] ? jokeHTML(JOKES[s.id]) : "");
      if (s.finale) h += '<p>Du hast <b>' + total() + " von " + maxPts() + " Punkten</b>. Der Fall Rom ist abgeschlossen.</p>";
      h += '<button class="btn" data-act="back">Weiter in der Tour</button></section>';
    }
    return h;
  }

  function render(keepScroll) {
    var sc = document.getElementById("scroller"), y = sc.scrollTop;
    var h = S.view ? viewPuzzle() : S.tab === "fall" ? viewFall() : S.tab === "tour" ? viewTour() : S.tab === "seals" ? viewSeals() : viewEltern();
    document.getElementById("app").innerHTML = h;
    renderTop(); renderTabs();
    sc.scrollTop = keepScroll ? y : 0;
  }

  /* ---------- Aktionen ---------- */
  function award(stepId) {
    var used = S.hints[stepId] || 0;
    S.pts[stepId] = Math.max(1, 3 - used);
  }
  function addNote(stepId) {
    var st = STEPS[stepId], stop = null;
    DAYS.forEach(function (d) { d.stops.forEach(function (s) { if (s.puzzle && s.puzzle.steps.indexOf(st) >= 0) stop = s; }); });
    S.notes.push({ id: stepId, t: stop.name, r: st.reveal });
  }
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]"); if (!el) return;
    var a = el.getAttribute("data-act");
    if (a === "tab") { S.tab = el.getAttribute("data-v"); S.view = null; S.resetAsk = false; S.unlocked = false; S.pinMsg = ""; render(); }
    else if (a === "pin") { tryPin(); }
    else if (a === "day") { S.day = el.getAttribute("data-v"); save(); render(); }
    else if (a === "open-dossier") { S.opened = true; save(); render(true); }
    else if (a === "goto") { S.day = el.getAttribute("data-d"); S.tab = "tour"; S.view = el.getAttribute("data-s"); save(); render(); }
    else if (a === "puzzle") { S.view = el.getAttribute("data-s"); S.tab = "tour"; render(); }
    else if (a === "back") { S.view = null; render(); }
    else if (a === "hint") { var id = el.getAttribute("data-step"); var inp = document.getElementById("ans"); if (inp) S.draft[id] = inp.value; S.hints[id] = (S.hints[id] || 0) + 1; save(); render(true); }
    else if (a === "check") { checkAnswer(el.getAttribute("data-step")); }
    else if (a === "giveup") { var g = el.getAttribute("data-step"); S.done[g] = true; S.pts[g] = 0; addNote(g); save(); render(true); }
    else if (a === "reset-ask") { S.resetAsk = true; render(true); }
    else if (a === "reset-no") { S.resetAsk = false; render(true); }
    else if (a === "reset-yes") { S.done = {}; S.pts = {}; S.notes = []; S.hints = {}; S.msg = {}; S.draft = {}; S.opened = false; S.resetAsk = false; save(); render(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target && e.target.id === "pin") { e.preventDefault(); tryPin(); return; }
    if (e.key === "Enter" && e.target && e.target.id === "ans") { e.preventDefault(); checkAnswer(e.target.getAttribute("data-step")); }
  });
  function checkAnswer(id) {
    var inp = document.getElementById("ans"), v = inp ? inp.value : "", st = STEPS[id];
    S.draft[id] = v;
    if (!norm(v)) { S.msg[id] = { k: "bad", t: "Erst mal was eintippen." }; render(true); return; }
    if (matches(v, st.accept)) {
      S.done[id] = true; award(id); addNote(id); S.msg[id] = null; save(); render(true);
    } else {
      S.msg[id] = { k: "bad", t: "Nope, das war's noch nicht. Guck nochmal genau hin oder zieh einen Tipp." }; render(true);
    }
  }

  render();
})();
</script>
</body>
</html>
