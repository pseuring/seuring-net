<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Der Fall Rom</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Der Fall Rom">
<meta name="theme-color" content="#0e1317">
<style>
/* Layout: eine Spalte, Kopfleiste mit vier Siegeln, feste Tab-Leiste unten, alles für Daumen auf dem iPhone.
   Look: Nachtakte aus Rom. Tinte und Pergament, Messing als Akzent, vier Elementfarben nur für die Siegel. */
:root {
  --ink: #0e1317;
  --panel: #162027;
  --panel-2: #1e2a33;
  --line: #2c3a45;
  --paper: #f1e9d6;
  --muted: #a9b2b6;
  --brass: #d0a64f;
  --brass-dim: #8d6d27;
  --earth: #a3b86c;
  --air: #8ec5ea;
  --fire: #f08a55;
  --water: #52bdb5;
  --ok: #8bd196;
  --bad: #f0968d;
  --display: "Iowan Old Style", "Baskerville", "Palatino Linotype", Georgia, serif;
  --body: -apple-system, "SF Pro Text", system-ui, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--ink); color: var(--paper); height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body { font-family: var(--body); font-size: 17px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
/* App-Rahmen: Die Seite selbst scrollt nie. Nur .scroller scrollt, die Tab-Leiste steht fest darunter (nichts ist position:fixed, das beim Ein- und Ausfahren der Safari-Leiste springen kann). */
.shell { height: 100%; height: 100dvh; display: flex; flex-direction: column; background: var(--ink); }
.scroller { flex: 1 1 auto; min-height: 0; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 0 16px 24px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: 2rem; } h2 { font-size: 1.35rem; } h3 { font-size: 1.08rem; }
p { margin: 0; }
a { color: var(--brass); }
button { font: inherit; color: inherit; }
.wrap { max-width: 560px; margin: 0 auto; }
.mono { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* Kopf */
.top { position: sticky; top: 0; z-index: 15; background: var(--ink); border-bottom: 1px solid var(--line);
  margin-inline: -16px; padding: 10px 16px; }
.top-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.mini-seals { display: flex; gap: 8px; align-items: center; }
.mini-seals svg { width: 30px; height: 30px; display: block; }
.pts { font-family: var(--mono); font-size: 0.85rem; color: var(--brass); white-space: nowrap; }

main { display: flex; flex-direction: column; gap: 16px; padding-top: 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.hero { background: var(--panel-2); border-color: var(--brass-dim); }
.stamp { align-self: flex-start; border: 1.5px solid var(--brass); color: var(--brass); font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.14em; padding: 3px 8px; border-radius: 3px; transform: rotate(-2deg); text-transform: uppercase; }
.letter { font-family: var(--display); font-size: 1.05rem; line-height: 1.55; display: flex; flex-direction: column; gap: 10px; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }

.btn { appearance: none; border: 0; border-radius: 12px; padding: 14px 18px; min-height: 48px; font-weight: 600; background: var(--brass); color: #1a1406; text-align: center; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--paper); border: 1.5px solid var(--line); }
.btn.dim { background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
.btn:disabled { opacity: 0.5; }
.btn:focus-visible, .tab:focus-visible, .chip:focus-visible, input:focus-visible { outline: 3px solid var(--air); outline-offset: 2px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }

/* Tab-Leiste */
.tabs { flex: 0 0 auto; background: var(--panel); border-top: 1px solid var(--line); padding: 6px 10px 6px; }
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.tab { appearance: none; border: 0; background: transparent; padding: 8px 4px; border-radius: 10px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 0.74rem; min-height: 52px; cursor: pointer; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--brass); background: var(--panel-2); }

/* Tour */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { appearance: none; flex: 0 0 auto; border: 1.5px solid var(--line); background: var(--panel); border-radius: 999px; padding: 9px 16px; min-height: 44px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--brass); color: var(--brass); background: var(--panel-2); }
.daybox { display: flex; flex-direction: column; gap: 6px; }
.timeline { display: flex; flex-direction: column; gap: 10px; }
.stop { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; }
.stop .t { font-family: var(--mono); font-size: 0.82rem; color: var(--brass); padding-top: 14px; text-align: right; }
.stop .body { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.stop .body.done { border-color: #3c5b45; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.tag.earth { color: var(--earth); border-color: var(--earth); } .tag.air { color: var(--air); border-color: var(--air); }
.tag.fire { color: var(--fire); border-color: var(--fire); } .tag.water { color: var(--water); border-color: var(--water); }
.tag.finale { color: var(--brass); border-color: var(--brass); } .tag.ok { color: var(--ok); border-color: var(--ok); }
.stop-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.stop-actions .btn { min-height: 44px; padding: 10px 14px; font-size: 0.95rem; flex: 1 1 130px; }

/* Rätsel */
.back { align-self: flex-start; }
.step { display: flex; flex-direction: column; gap: 10px; }
.q { font-size: 1.1rem; }
input[type="text"] { width: 100%; font-size: 16px; padding: 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--ink); color: var(--paper); font-family: var(--body); }
.msg { min-height: 1.4em; font-size: 0.95rem; }
.msg.bad { color: var(--bad); } .msg.ok { color: var(--ok); }
.hint { background: var(--ink); border: 1px dashed var(--brass-dim); border-radius: 10px; padding: 10px 12px; font-size: 0.95rem; }
.reveal { background: var(--ink); border-left: 3px solid var(--ok); padding: 10px 12px; border-radius: 4px 10px 10px 4px; display: flex; flex-direction: column; gap: 6px; }
.seal-win { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 10px 0; }
.seal-win svg { width: 120px; height: 120px; animation: pop 0.6s ease-out both; }
@keyframes pop { from { transform: scale(0.4) rotate(-12deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .seal-win svg { animation: none; } }
.locked { opacity: 0.85; }

/* Siegel-Seite */
.seal-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.seal-cell { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0; }
.seal-cell svg { width: 84px; height: 84px; }
.notes { display: flex; flex-direction: column; gap: 10px; }
.note { border-left: 3px solid var(--brass-dim); padding-left: 12px; }
.note b { font-family: var(--display); font-weight: 600; }

/* Eltern */
details { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
summary { cursor: pointer; font-weight: 600; min-height: 32px; display: flex; align-items: center; }
details[open] summary { margin-bottom: 8px; }
ul.plain { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 6px; }
.kv { display: grid; grid-template-columns: 1fr; gap: 2px; }
.kv + .kv { margin-top: 8px; }
.kv b { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--brass); font-weight: 600; }
.warn { border: 1px solid var(--brass-dim); background: var(--panel-2); border-radius: 10px; padding: 10px 12px; font-size: 0.92rem; }

.hd { display: flex; gap: 10px; align-items: center; }
.badge { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); color: var(--brass); display: grid; place-items: center; }
.badge .ico { width: 28px; height: 28px; }
.scene { margin: -4px -4px 0; }
.scenesvg, .routesvg { display: block; width: 100%; height: auto; }
.bubble { display: flex; gap: 12px; align-items: flex-start; background: var(--panel-2); border: 1px solid var(--brass-dim); border-radius: 14px 14px 14px 4px; padding: 12px 14px; font-size: 0.95rem; }
.bubble b { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--brass); }
.fist { flex: 0 0 auto; width: 34px; height: 34px; color: var(--brass); }
.fist svg { width: 100%; height: 100%; }
.legend { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.lg { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.8rem; color: var(--muted); }
.lg svg { width: 100%; max-width: 64px; height: auto; }
.viz { display: block; width: 100%; height: auto; background: var(--ink); border: 1px solid var(--line); border-radius: 10px; }
</style>
</head>
<body>

<div class="shell">
  <div class="scroller" id="scroller">
    <div class="top"><div class="top-in" id="top"></div></div>
    <div class="wrap"><main id="app" aria-live="polite"></main></div>
  </div>
  <nav class="tabs" aria-label="Bereiche"><div class="tabs-in" id="tabs"></div></nav>
</div>

<script>
(function () {
  "use strict";

  /* ---------- Inhalt ---------- */
  var ELEM = {
    earth: { name: "Erde", color: "var(--earth)", up: false, bar: true },
    water: { name: "Wasser", color: "var(--water)", up: false, bar: false },
    fire: { name: "Feuer", color: "var(--fire)", up: true, bar: false },
    air: { name: "Luft", color: "var(--air)", up: true, bar: true }
  };
  var ORDER = ["earth", "water", "fire", "air"];

  var DAYS = [
    { id: "so", label: "So 25.10.", title: "Anreise und Auftrag", role: "Navigator: du führst Papa zum richtigen Gleis und zur Unterkunft.", stops: [
      { id: "s-zug", time: "13:57", name: "Zug nach Rom", where: "Rovereto, Frecciarossa 8519, Ankunft Roma Termini 18:10", maps: "Stazione di Rovereto", note: "Dein Job als Navigator: Gleis auf der Anzeigetafel finden und im Zug den richtigen Wagen. Die Tickets hat Papa im Handy." },
      { id: "s-hotel", time: "18:30", name: "Einchecken", where: "Napoleone Suite, Via Napoleone III 28", maps: "Via Napoleone III 28, Roma", note: "Gleich beim Bahnhof. Ausweis bereithalten." },
      { id: "s-dossier", time: "19:15", name: "Das Dossier", where: "Spaziergang zum Kolosseum bei Nacht", maps: "Colosseo, Roma", kind: "dossier", note: "Hier startet der Fall. Check unterwegs das Dossier auf der Startseite. Das Kolosseum gibt's heute nur zum Angucken, gelöst wird ab morgen." },
      { id: "s-essen", time: "20:00", name: "Abendessen", where: "Ai Tre Scalini, Via Panisperna 251", maps: "Ai Tre Scalini Via Panisperna 251 Roma", note: "Kassenwart: Du rechnest die Rechnung nach, Papa darf nicht schummeln. Frage des Abends: Was war heute das Schrägste?" }
    ]},
    { id: "mo", label: "Mo 26.10.", title: "Erde und Wasser", role: "Fotograf: fünf Bilder zum Thema Ruine trifft Alltag.", stops: [
      { id: "m-pantheon", time: "09:15", name: "Pantheon", where: "Piazza della Rotonda", maps: "Pantheon Roma", note: "Gleich als Erstes. Vom Hotel mit dem Taxi (rund 10 Minuten) oder Bus, Papa prüft vorher in Karten, was fährt. Laut Quelle ab 9 Uhr offen, morgens ist es leerer. Kinder unter 18 gratis, Erwachsene wenige Euro.", puzzle: {
        title: "Das Grab des Meisters", intro: "Fast 2000 Jahre alt und steht immer noch. Hier liegt ein berühmter Maler, dessen Kapelle ihr heute Abend besucht.",
        steps: [
          { id: "pan1", viz: "dome", q: "Die Öffnung ganz oben in der Kuppel lässt Licht und Regen herein. Wie heißt sie?", accept: ["oculus", "auge"], hints: ["Das lateinische Wort bedeutet Auge.", "Es beginnt mit O."], reveal: "Das Oculus misst gut acht Meter. Der Boden neigt sich leicht und hat Abflusslöcher, damit der Regen abläuft." },
          { id: "pan2", viz: "tl|1483|1520|Raffael geboren|gestorben", q: "Such Raffaels Grab: Über dem Sarkophag steht eine Marienstatue. Raffael lebte von 1483 bis 1520. Wie alt wurde er?", accept: ["37"], hints: ["Rechne 1520 minus 1483.", "Es sind mehr als 35 und weniger als 40 Jahre."], reveal: "37 Jahre. Er starb 1520, oft heißt es, genau an seinem Geburtstag. Sein Grab im Pantheon ist bis heute ein Pilgerort." }
        ] } },
      { id: "m-moses", time: "10:30", name: "Moses von Michelangelo", where: "San Pietro in Vincoli", maps: "San Pietro in Vincoli Roma", note: "Eintritt frei. Aufwärmrätsel. Vom Pantheon mit Taxi oder Bus (rund 15 Minuten), Navigator wählt in Apple Karten die Öffis. Das Ende ist ein kurzer Fußweg.", puzzle: {
        title: "Der Mann mit dem Auffälligen", intro: "Ein Marmor-Typ sitzt hier seit über 500 Jahren rum. Guck ihm mal auf den Kopf.",
        steps: [{ id: "moses1", q: "Moses hat was Seltsames auf dem Kopf. Was?", accept: ["horn", "hoerner", "hörner", "horner"], hints: ["Schau auf seine Stirn, ganz oben.", "Zwei kleine spitze Dinger, wie bei einem Stier."], reveal: "Hörner. Eine alte lateinische Bibelübersetzung machte aus einem Wort für strahlend das Wort gehörnt (so wird es meist erklärt). Michelangelo hat es einfach übernommen." }] } },
      { id: "m-forum", time: "11:15", name: "Forum Romanum und Palatin", where: "Eingang Largo della Salara Vecchia", maps: "Foro Romano Largo della Salara Vecchia Roma", note: "Eltern kaufen vorher den Forum Pass Super. Kapitelfrage: Wo hat Rom entschieden? Heute ruhig angehen: Nur die Via Sacra bis zum Titusbogen, den Palatin-Hügel lasst ihr weg. Bänke und Pausen sind ausdrücklich erlaubt.", puzzle: {
        title: "Beute vom Titusbogen", intro: "Der Titusbogen feiert einen Sieg. Auf einem Relief tragen Soldaten ihre Beute durch die Stadt.",
        steps: [{ id: "forum1", q: "Die Soldaten tragen einen großen Leuchter mit sieben Armen aus einem eroberten Tempel. Wie heißt er?", accept: ["menora", "menorah", "leuchter"], hints: ["Er gehört zum jüdischen Glauben.", "Der Name beginnt mit M."], reveal: "Die Menora aus dem Tempel in Jerusalem. Rom eroberte die Stadt im Jahr 70 nach Christus. Der Bogen ist Siegerpropaganda in Stein." },
          { id: "forum2", viz: "tl|70|2026|Sieg über Jerusalem|Heute", q: "Der Sieg über Jerusalem war im Jahr 70 nach Christus. Wie viele Jahre ist das bis 2026 her?", accept: ["1956", "1 956"], hints: ["Rechne 2026 minus 70.", "Erst 2026 minus 100, dann plus 30."], reveal: "1956 Jahre. Der Bogen selbst wurde nach dem Tod von Titus gebaut, aber er erinnert an dieses Ereignis." }] } },
      { id: "m-kolo", time: "12:45", name: "Kolosseum im Hellen", where: "kurze Runde bei Tageslicht, dazu der Konstantinsbogen", maps: "Colosseo Roma", note: "Gestern Abend wart ihr schon da. Jetzt nur eine kurze Runde im Hellen, rund 15 Minuten, die Bögen zählen und weiter. Innen war alles ausverkauft.", puzzle: {
        title: "Bögen zählen", intro: "Das größte Stadion der Antike. Die Außenwand hat ein Muster, das du zählen kannst.",
        steps: [{ id: "kolo1", viz: "arch0", q: "Zähle von unten nach oben die Reihen mit Bögen (ohne die geschlossene Wand ganz oben). Wie viele Reihen sind es?", accept: ["3", "drei"], hints: ["Zähle nur die Reihen mit Löchern.", "Es sind weniger als vier."], reveal: "Drei Reihen mit je 80 Bögen, darüber eine geschlossene Wand mit kleinen Fenstern. Die Säulenformen wechseln von unten nach oben von schlicht zu verziert." },
          { id: "kolo2", viz: "arch80", q: "Jede der drei Reihen hat 80 Bögen. Wie viele Bögen sind das zusammen?", accept: ["240"], hints: ["80 + 80 + 80.", "3 mal 80."], reveal: "240 Bögen. 76 der Bögen im Erdgeschoss waren nummerierte Eingänge für das Publikum, damit sich Zehntausende schnell verteilen konnten." }] } },
      { id: "m-essen1", time: "13:15", name: "Mittagessen", where: "Pizza al taglio in der Nähe, Via di San Giovanni in Laterano", maps: "Luzzi Via di San Giovanni in Laterano 88 Roma", note: "Kassenwart: Tagesbudget aus dem Umschlag, du rechnest ab. Heute kurz halten, rund 45 Minuten. Vom Kolosseum sind es knapp 10 Minuten zu Fuß." },
      { id: "m-smm", time: "14:30", name: "Santa Maria Maggiore (freiwillig)", where: "Piazza di Santa Maria Maggiore, nahe der Unterkunft", maps: "Basilica di Santa Maria Maggiore Roma", note: "Metro B ab Colosseo bis Termini, dann ein kurzes Stück zu Fuß. Große Basilika mit goldener Decke, ruhig und flach, mit Sitzbänken. Danach Eis oder Kaffee in der Nähe. Wenn ihr lieber Pause macht, lasst es weg." },
      { id: "m-hotel", time: "16:00", name: "In der Unterkunft", where: "Napoleone Suite, Via Napoleone III 28", maps: "Via Napoleone III 28, Roma", note: "Ab 16 Uhr bleibt ihr in der Unterkunft, denn Papa telefoniert von 16 bis 17 Uhr für die Arbeit. Bein hochlegen, leise sein." },
      { id: "m-metro", time: "17:00", name: "Metro zur Piazza del Popolo", where: "Metro A ab Termini Richtung Battistini bis Flaminio", maps: "Flaminio metro Roma", note: "Navigator: Linie A ab Termini, Haltestelle Flaminio, ohne Umsteigen. Danach durch das Tor auf den Platz. Draußen wird es jetzt dunkel, das macht die Plätze schöner." },
      { id: "m-popolo", time: "17:25", name: "Santa Maria del Popolo", where: "Piazza del Popolo, Chigi-Kapelle", maps: "Santa Maria del Popolo Roma", seal: "earth", note: "Die Kirche ist laut Quelle nachmittags bis 19 Uhr offen. Leise sein, Schultern und Knie bedecken. Etwa eine halbe Stunde einplanen.", puzzle: {
        title: "Siegel der Erde", intro: "Ort Nummer eins. Eine Kapelle voller versteckter Zeichen. Such die Seitenkapelle mit den zwei Bernini-Statuen.",
        steps: [
          { id: "pop1", q: "Die Chigi-Kapelle hat ein berühmter Maler entworfen. Er liegt auch im Pantheon begraben. Wie heißt er?", accept: ["raffael", "raphael", "raffaello"], hints: ["Auch eine der Ninja-Turtles heißt so.", "Er hat die Schule von Athen gemalt."], reveal: "Raffael. Er entwarf die Kapelle für den reichen Bankier Agostino Chigi." },
          { id: "pop2", q: "Bernini hat in der Kapelle zwei Propheten aus Stein gemeißelt. Einer sitzt zwischen Löwen. Wie heißt er?", accept: ["daniel"], hints: ["Seine Geschichte heißt Daniel in der Löwengrube.", "Der Name hat sechs Buchstaben."], reveal: "Daniel, und gegenüber steht Habakuk mit einem Engel. Beide Statuen sind von Bernini. Das Zeichen der Erde ist ein Dreieck mit der Spitze nach unten und einem Querstrich." }
        ], outro: "Siegel der Erde gesichert." } },
      { id: "m-navona", time: "18:20", name: "Piazza Navona", where: "Vier-Ströme-Brunnen von Bernini", maps: "Fontana dei Quattro Fiumi Roma", seal: "water", note: "Vom Popolo mit Taxi oder Bus (rund 10 Minuten), zu Fuß wären es 25. Abends ist der Brunnen angestrahlt. Eis unterwegs erlaubt.", puzzle: {
        title: "Siegel des Wassers", intro: "Ort Nummer zwei. Vier Flussgötter hocken um einen Obelisken. Einer versteckt sein Gesicht.",
        steps: [
          { id: "nav1", viz: "rivers", q: "Die vier Flüsse sind Nil, Ganges, Donau und Rio de la Plata. Einer hält sich ein Tuch vor den Kopf. Welcher?", accept: ["nil"], hints: ["Er steht für den Fluss, dessen Quelle damals niemand kannte.", "Er fließt in Afrika."], reveal: "Der Nil. Seine Quelle war zur Bauzeit unbekannt, deshalb ist sein Kopf verhüllt (so wird es meist erklärt)." },
          { id: "nav2", q: "Oben auf dem Obelisken, rund 16 Meter hoch, sitzt ein Vogel. Welcher?", accept: ["taube", "dove"], hints: ["Er ist ein Friedenssymbol.", "Er steht auch im Wappen der Familie des Papstes, der den Brunnen bestellte."], reveal: "Eine Taube. Das Zeichen des Wassers ist ein Dreieck mit der Spitze nach unten, ohne Querstrich." },
          { id: "nav3", viz: "tl|1651|2026|Brunnen fertig|Heute", q: "Bernini hat den Brunnen 1651 fertiggestellt. Wie alt ist er heute (2026)?", accept: ["375"], hints: ["Rechne 2026 minus 1651.", "2026 minus 1600 ist 426, dann noch 51 abziehen."], reveal: "375 Jahre. Der Brunnen läuft also seit gut dreieinhalb Jahrhunderten." }

        if (nh < st.hints.length) h += '<button class="btn ghost" data-act="hint" data-step="' + st.id + '">Tipp zeigen</button>';
        h += "</div>";
        if (nh >= st.hints.length) h += '<button class="btn dim" data-act="giveup" data-step="' + st.id + '">Ich checke es nicht, Lösung zeigen</button>';
        h += "</section>";
      }
    });
    if (stopDone(s)) {
      h += '<section class="card seal-win">';
      if (s.seal) h += sealSVG(s.seal, true) + "<h2>Siegel der " + ELEM[s.seal].name + "</h2>";
      else if (s.finale) h += finaleSVG(true) + "<h2>Fall gelöst</h2>";
      else h += "<h2>Station geschafft</h2>";
      h += "<p class=\"muted\">" + esc(p.outro || "Gut gemacht, Symbologe. Läuft.") + "</p>" + (JOKES[s.id] ? jokeHTML(JOKES[s.id]) : "");
      if (s.finale) h += '<p>Du hast <b>' + total() + " von " + maxPts() + " Punkten</b>. Der Fall Rom ist abgeschlossen.</p>";
      h += '<button class="btn" data-act="back">Weiter in der Tour</button></section>';
    }
    return h;
  }

  function render(keepScroll) {
    var sc = document.getElementById("scroller"), y = sc.scrollTop;
    var h = S.view ? viewPuzzle() : S.tab === "fall" ? viewFall() : S.tab === "tour" ? viewTour() : S.tab === "seals" ? viewSeals() : viewEltern();
    document.getElementById("app").innerHTML = h;
    renderTop(); renderTabs();
    sc.scrollTop = keepScroll ? y : 0;
  }

  /* ---------- Aktionen ---------- */
  function award(stepId) {
    var used = S.hints[stepId] || 0;
    S.pts[stepId] = Math.max(1, 3 - used);
  }
  function addNote(stepId) {
    var st = STEPS[stepId], stop = null;
    DAYS.forEach(function (d) { d.stops.forEach(function (s) { if (s.puzzle && s.puzzle.steps.indexOf(st) >= 0) stop = s; }); });
    S.notes.push({ id: stepId, t: stop.name, r: st.reveal });
  }
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]"); if (!el) return;
    var a = el.getAttribute("data-act");
    if (a === "tab") { S.tab = el.getAttribute("data-v"); S.view = null; S.resetAsk = false; S.unlocked = false; S.pinMsg = ""; render(); }
    else if (a === "pin") { tryPin(); }
    else if (a === "day") { S.day = el.getAttribute("data-v"); save(); render(); }
    else if (a === "open-dossier") { S.opened = true; save(); render(true); }
    else if (a === "goto") { S.day = el.getAttribute("data-d"); S.tab = "tour"; S.view = el.getAttribute("data-s"); save(); render(); }
    else if (a === "puzzle") { S.view = el.getAttribute("data-s"); S.tab = "tour"; render(); }
    else if (a === "back") { S.view = null; render(); }
    else if (a === "hint") { var id = el.getAttribute("data-step"); var inp = document.getElementById("ans"); if (inp) S.draft[id] = inp.value; S.hints[id] = (S.hints[id] || 0) + 1; save(); render(true); }
    else if (a === "check") { checkAnswer(el.getAttribute("data-step")); }
    else if (a === "giveup") { var g = el.getAttribute("data-step"); S.done[g] = true; S.pts[g] = 0; addNote(g); save(); render(); }
    else if (a === "reset-ask") { S.resetAsk = true; render(true); }
    else if (a === "reset-no") { S.resetAsk = false; render(true); }
    else if (a === "reset-yes") { S.done = {}; S.pts = {}; S.notes = []; S.hints = {}; S.msg = {}; S.draft = {}; S.opened = false; S.resetAsk = false; save(); render(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target && e.target.id === "pin") { e.preventDefault(); tryPin(); return; }
    if (e.key === "Enter" && e.target && e.target.id === "ans") { e.preventDefault(); checkAnswer(e.target.getAttribute("data-step")); }
  });
  function checkAnswer(id) {
    var inp = document.getElementById("ans"), v = inp ? inp.value : "", st = STEPS[id];
    S.draft[id] = v;
    if (!norm(v)) { S.msg[id] = { k: "bad", t: "Erst mal was eintippen." }; render(true); return; }
    if (matches(v, st.accept)) {
      S.done[id] = true; award(id); addNote(id); S.msg[id] = null; save(); render();
    } else {
      S.msg[id] = { k: "bad", t: "Nope, das war's noch nicht. Guck nochmal genau hin oder zieh einen Tipp." }; render(true);
    }
  }

  render();
})();
</script>
</body>
</html>
